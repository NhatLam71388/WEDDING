name: Deploy Cloudflare backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e8045479a2ef8992d1258b748ac5f4c0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add the CLOUDFLARE_API_TOKEN repository secret to enable backend deployment."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test API and admin
        run: >-
          node --test
          tests/api.integration.test.mjs
          tests/admin-ui-regression.test.mjs
          tests/cloudflare-deploy.test.mjs

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm run db:migrate:remote

      - name: Deploy Worker
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm run deploy:worker
